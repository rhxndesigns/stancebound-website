<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">

<title>STANCEBOUND Admin</title>

<style>

:root {
  color-scheme: dark;
}

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  min-height: 100vh;
  background: #050505;
  color: #fff;
  font-family: Arial, Helvetica, sans-serif;
}

main {
  width: min(760px, 92%);
  margin: auto;
  padding: 50px 0;
}

.brand {
  text-align: center;
  letter-spacing: 5px;
  font-weight: 800;
  font-size: clamp(28px, 7vw, 46px);
  margin-bottom: 8px;
}

.sub {
  text-align: center;
  color: #777;
  letter-spacing: 3px;
  font-size: 10px;
  margin-bottom: 35px;
}

.panel {
  border: 1px solid #222;
  background: #090909;
  padding: 24px;
  margin-bottom: 16px;
}

label {
  display: block;
  color: #999;
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  margin: 15px 0 7px;
}

input,
textarea {
  width: 100%;
  background: #050505;
  border: 1px solid #333;
  color: #fff;
  padding: 14px;
  font: inherit;
}

textarea {
  min-height: 110px;
  resize: vertical;
}

button {
  width: 100%;
  padding: 15px;
  margin-top: 16px;
  background: #fff;
  color: #050505;
  border: 0;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  cursor: pointer;
  transition: transform .16s ease;
}

button:active {
  transform: scale(.97);
}

button.secondary {
  background: transparent;
  color: #bbb;
  border: 1px solid #333;
}

.status {
  min-height: 22px;
  margin-top: 14px;
  color: #aaa;
  font-size: 12px;
}

.hidden {
  display: none;
}



/* PHOTO MANAGER */
select, input[type="file"] {
  width: 100%; background:#050505; border:1px solid #333; color:#fff; padding:14px; font:inherit;
}
.photo-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px; }
.photo-card { border:1px solid #222; background:#050505; padding:10px; }
.photo-card img { width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:#111; }
.photo-meta { color:#999; font-size:11px; line-height:1.5; margin-top:8px; overflow-wrap:anywhere; }
.photo-card button { margin-top:10px; padding:11px; }
.danger { background:#2a0909; color:#fff; border:1px solid #6a2222; }
.preview { width:100%; max-height:320px; object-fit:contain; margin-top:14px; border:1px solid #222; background:#050505; display:none; }
.help { color:#777; font-size:11px; line-height:1.6; margin-top:8px; }
@media (max-width:560px) { .photo-grid { grid-template-columns:1fr; } }

</style>
</head>

<body>

<main>

<div class="brand">
STANCEBOUND
</div>

<div class="sub">
ADMIN CONTROL
</div>


<section id="login" class="panel">

<h2>Admin Login</h2>

<label>Email</label>

<input
  id="email"
  type="email"
  value="ryan@stancebound.com"
  autocomplete="username"
>

<label>Password</label>

<input
  id="password"
  type="password"
  autocomplete="current-password"
>

<button id="loginBtn">
Log In
</button>

<div
  id="loginStatus"
  class="status">
</div>

</section>


<section
  id="editor"
  class="hidden">

<div class="panel">

<h2>Website Content</h2>

<div id="fields"></div>

<button id="saveBtn">
Save Changes
</button>

<button
  id="logoutBtn"
  class="secondary">
Log Out
</button>

<div
  id="saveStatus"
  class="status">
</div>

</div>

<div class="panel">
  <h2>Photo Manager</h2>
  <p class="help">Upload website photos from your phone. Images are resized in your browser before upload to keep the site quick.</p>

  <label>Website Section</label>
  <select id="photoSection">
    <option value="detailing_process">Detailing - The Process</option>
    <option value="before">Interior - Before</option>
    <option value="after">Interior - After</option>
    <option value="interior_details">Interior Details</option>
    <option value="photography">Photography</option>
  </select>

  <label>Photo</label>
  <input id="photoFile" type="file" accept="image/jpeg,image/png,image/webp">
  <img id="photoPreview" class="preview" alt="Selected photo preview">

  <label>Caption (optional)</label>
  <input id="photoCaption" type="text" maxlength="160" placeholder="e.g. Mercedes CLA full valet">

  <label>Display Order</label>
  <input id="photoOrder" type="number" value="0" min="0" step="1">

  <button id="uploadPhotoBtn">Upload Photo</button>
  <div id="photoStatus" class="status"></div>

  <div id="photoGrid" class="photo-grid"></div>
</div>

</section>

</main>


<script type="module">

import { createClient }
from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';


const supabase = createClient(
  'https://fxlekwzcxedkiyqfswvq.supabase.co',
  'sb_publishable_FNT90aCj5_w4rJypLsw3Bg_iLNpOYld'
);


const login =
  document.querySelector('#login');

const editor =
  document.querySelector('#editor');

const fields =
  document.querySelector('#fields');


const labels = {

  home_tagline:
    'Home tagline',

  home_subtitle:
    'Home subtitle',

  home_description:
    'Home description',

  detailing_title:
    'Detailing title',

  detailing_description:
    'Detailing description',

  service_exterior_title:
    'Exterior title',

  service_exterior_description:
    'Exterior description',

  service_interior_title:
    'Interior title',

  service_interior_description:
    'Interior description',

  service_valet_title:
    'Full valet title',

  service_valet_description:
    'Full valet description',

  detailing_cta_title:
    'Detailing CTA title',

  detailing_cta_description:
    'Detailing CTA description',

  photography_title:
    'Photography title',

  photography_description:
    'Photography description',

  photography_cta_title:
    'Photography CTA title',

  photography_cta_description:
    'Photography CTA description',

  contact_title:
    'Contact title',

  contact_description:
    'Contact description',

  contact_card_title:
    'Contact card title',

  contact_card_description:
    'Contact card description',

  business_email:
    'Business email',

  instagram_handle:
    'Instagram handle',

  instagram_url:
    'Instagram URL',

  tiktok_handle:
    'TikTok handle',

  tiktok_url:
    'TikTok URL',

  location_primary:
    'Primary location',

  location_secondary:
    'Secondary location'
};


async function loadContent() {

  const {
    data,
    error
  } = await supabase
    .from('site_content')
    .select(
      'content_key,content_value'
    )
    .order('id');


  if (error) {

    document
      .querySelector('#saveStatus')
      .textContent =
      error.message;

    return;
  }


  fields.innerHTML = '';


  for (const row of data) {

    const wrapper =
      document.createElement('div');


    const label =
      document.createElement('label');


    label.textContent =
      labels[row.content_key]
      || row.content_key;


    const isLong =
      row.content_value.length > 55;


    const input =
      document.createElement(
        isLong
          ? 'textarea'
          : 'input'
      );


    input.value =
      row.content_value;


    input.dataset.key =
      row.content_key;


    wrapper.append(
      label,
      input
    );


    fields.append(wrapper);

  }

}


async function showCorrectScreen() {

  const {
    data: {
      session
    }
  } =
    await supabase
      .auth
      .getSession();


  login.classList.toggle(
    'hidden',
    !!session
  );


  editor.classList.toggle(
    'hidden',
    !session
  );


  if (session) {
    loadContent();
    loadPhotos();
  }

}


document
  .querySelector('#loginBtn')
  .onclick =
  async () => {

    const status =
      document
        .querySelector(
          '#loginStatus'
        );


    status.textContent =
      'Logging in...';


    const {
      error
    } =
      await supabase
        .auth
        .signInWithPassword({

          email:
            document
              .querySelector(
                '#email'
              )
              .value
              .trim(),

          password:
            document
              .querySelector(
                '#password'
              )
              .value

        });


    if (error) {

      status.textContent =
        error.message;

      return;

    }


    status.textContent = '';

    showCorrectScreen();

  };


document
  .querySelector('#saveBtn')
  .onclick =
  async () => {

    const status =
      document
        .querySelector(
          '#saveStatus'
        );


    status.textContent =
      'Saving...';


    const items =
      [
        ...fields.querySelectorAll(
          '[data-key]'
        )
      ];


    for (const item of items) {

      const {
        error
      } =
        await supabase
          .from(
            'site_content'
          )
          .update({

            content_value:
              item.value,

            updated_at:
              new Date()
                .toISOString()

          })
          .eq(
            'content_key',
            item.dataset.key
          );


      if (error) {

        status.textContent =
          error.message;

        return;

      }

    }


    status.textContent =
      'Saved. Your website content is updated.';

  };


const photoFile = document.querySelector('#photoFile');
const photoPreview = document.querySelector('#photoPreview');
const photoGrid = document.querySelector('#photoGrid');
const photoStatus = document.querySelector('#photoStatus');

photoFile.addEventListener('change', () => {
  const file = photoFile.files?.[0];
  if (!file) {
    photoPreview.style.display = 'none';
    photoPreview.removeAttribute('src');
    return;
  }
  photoPreview.src = URL.createObjectURL(file);
  photoPreview.style.display = 'block';
});

async function resizeImage(file) {
  const bitmap = await createImageBitmap(file);
  const maxEdge = 2400;
  let width = bitmap.width;
  let height = bitmap.height;
  const scale = Math.min(1, maxEdge / Math.max(width, height));
  width = Math.round(width * scale);
  height = Math.round(height * scale);

  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, width, height);
  bitmap.close();

  return await new Promise((resolve, reject) => {
    canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Could not prepare image.')), 'image/webp', 0.88);
  });
}

async function loadPhotos() {
  const { data, error } = await supabase
    .from('site_images')
    .select('id,storage_path,section,caption,sort_order,created_at')
    .order('section')
    .order('sort_order')
    .order('id');

  if (error) {
    photoStatus.textContent = error.message;
    return;
  }

  photoGrid.innerHTML = '';
  if (!data?.length) {
    photoGrid.innerHTML = '<div class="help">No uploaded photos yet.</div>';
    return;
  }

  for (const row of data) {
    const { data: publicData } = supabase.storage
      .from('website-images')
      .getPublicUrl(row.storage_path);

    const card = document.createElement('div');
    card.className = 'photo-card';

    const img = document.createElement('img');
    img.src = publicData.publicUrl;
    img.alt = row.caption || 'STANCEBOUND website photo';

    const meta = document.createElement('div');
    meta.className = 'photo-meta';
    meta.textContent = `${row.section.replaceAll('_',' ')} · order ${row.sort_order}${row.caption ? ' · ' + row.caption : ''}`;

    const del = document.createElement('button');
    del.className = 'danger';
    del.textContent = 'Delete Photo';
    del.onclick = async () => {
      if (!confirm('Delete this photo from the website?')) return;
      del.disabled = true;
      photoStatus.textContent = 'Deleting...';

      const { error: storageError } = await supabase.storage
        .from('website-images')
        .remove([row.storage_path]);
      if (storageError) {
        photoStatus.textContent = storageError.message;
        del.disabled = false;
        return;
      }

      const { error: dbError } = await supabase
        .from('site_images')
        .delete()
        .eq('id', row.id);
      if (dbError) {
        photoStatus.textContent = dbError.message;
        del.disabled = false;
        return;
      }

      photoStatus.textContent = 'Photo deleted.';
      loadPhotos();
    };

    card.append(img, meta, del);
    photoGrid.append(card);
  }
}

document.querySelector('#uploadPhotoBtn').onclick = async () => {
  const file = photoFile.files?.[0];
  if (!file) {
    photoStatus.textContent = 'Choose a photo first.';
    return;
  }

  if (!['image/jpeg','image/png','image/webp'].includes(file.type)) {
    photoStatus.textContent = 'Please choose a JPEG, PNG or WebP image.';
    return;
  }

  const uploadBtn = document.querySelector('#uploadPhotoBtn');
  uploadBtn.disabled = true;
  photoStatus.textContent = 'Preparing photo...';

  try {
    const blob = await resizeImage(file);
    const section = document.querySelector('#photoSection').value;
    const caption = document.querySelector('#photoCaption').value.trim();
    const sortOrder = Number.parseInt(document.querySelector('#photoOrder').value, 10) || 0;
    const path = `${section}/${Date.now()}-${crypto.randomUUID()}.webp`;

    photoStatus.textContent = 'Uploading photo...';
    const { error: uploadError } = await supabase.storage
      .from('website-images')
      .upload(path, blob, { contentType:'image/webp', upsert:false });
    if (uploadError) throw uploadError;

    const { error: insertError } = await supabase
      .from('site_images')
      .insert({ storage_path:path, section, caption, sort_order:sortOrder });

    if (insertError) {
      await supabase.storage.from('website-images').remove([path]);
      throw insertError;
    }

    photoStatus.textContent = 'Photo uploaded successfully.';
    photoFile.value = '';
    document.querySelector('#photoCaption').value = '';
    photoPreview.style.display = 'none';
    photoPreview.removeAttribute('src');
    await loadPhotos();
  } catch (error) {
    photoStatus.textContent = error?.message || 'Upload failed.';
  } finally {
    uploadBtn.disabled = false;
  }
};

document
  .querySelector('#logoutBtn')
  .onclick =
  async () => {

    await supabase
      .auth
      .signOut();

    showCorrectScreen();

  };


showCorrectScreen();

</script>

</body>
</html>
