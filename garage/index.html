import * as T from 'three';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try{const scene=new T.Scene();scene.background=new T.Color(0x101015);scene.fog=new T.Fog(0x101015,15,35);const camera=new T.PerspectiveCamera(48,innerWidth/innerHeight,.1,70);const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.35;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2;controls.maxDistance=13;controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,.8,0);camera.position.set(7,4,8);controls.update();
const mat=(c,m=0,r=.6)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});const paint=mat(0x24252c,.8,.24),black=mat(0x09090b,.1,.8),glass=mat(0x182b39,.65,.13),silver=mat(0x777985,.8,.25),wall=mat(0x19191e),red=new T.MeshBasicMaterial({color:0xff1838}),white=new T.MeshBasicMaterial({color:0xf0f5ff});function mesh(g,m,x,y,z,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p=scene){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function rounded(w,h,d,r,m,x,y,z,p=scene){const sh=new T.Shape();const a=w/2,b=h/2;sh.moveTo(-a+r,-b);sh.lineTo(a-r,-b);sh.quadraticCurveTo(a,-b,a,-b+r);sh.lineTo(a,b-r);sh.quadraticCurveTo(a,b,a-r,b);sh.lineTo(-a+r,b);sh.quadraticCurveTo(-a,b,-a,b-r);sh.lineTo(-a,-b+r);sh.quadraticCurveTo(-a,-b,-a+r,-b);const g=new T.ExtrudeGeometry(sh,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r*.45,bevelSegments:3,steps:1});g.translate(0,0,-(d-2*r)/2);return mesh(g,m,x,y,z,p)}
box(18,.2,20,mat(0x303037,.2,.48),0,-.12,0);box(18,6,.2,wall,0,3,-8);box(.2,6,20,wall,-8,3,0);box(.2,6,20,wall,8,3,0);for(let x=-7;x<=7;x+=2){box(.045,5,.045,red,x,2.6,-7.85)}for(let z=-6;z<7;z+=3){box(.06,.06,2.8,red,-7.8,1,z);box(.06,.06,2.8,red,7.8,1,z)}for(let x=-5;x<=5;x+=2.5){for(let z=-5;z<=5;z+=2.8){const points=[];for(let i=0;i<=6;i++){let a=i*Math.PI/3;points.push(new T.Vector3(x+Math.cos(a)*1.15,5.1,z+Math.sin(a)*1.15))}for(let i=0;i<6;i++){const a=points[i],b=points[i+1],d=b.clone().sub(a);const o=mesh(new T.CylinderGeometry(.035,.035,d.length(),6),white,0,0,0);o.position.copy(a.clone().add(b).multiplyScalar(.5));o.quaternion.setFromUnitVectors(new T.Vector3(0,1,0),d.normalize())}}}scene.add(new T.HemisphereLight(0xc6d9ff,0x39313b,2));for(const [x,z,c] of [[-4,3,0xffffff],[4,-3,0xffffff],[-5,-4,0xff1235],[5,4,0xff1235]]){const l=new T.PointLight(c,75,18);l.position.set(x,4,z);scene.add(l)}const key=new T.DirectionalLight(0xffffff,2.8);key.position.set(2,7,4);key.castShadow=true;key.shadow.mapSize.set(1024,1024);scene.add(key);
const cv=document.createElement('canvas');cv.width=1024;cv.height=256;const ctx=cv.getContext('2d');ctx.fillStyle='#17171b';ctx.fillRect(0,0,1024,256);ctx.font='bold 96px Arial';ctx.textAlign='center';ctx.fillStyle='#eee';ctx.fillText('STANCEBOUND',512,120);ctx.font='30px Arial';ctx.fillStyle='#ff2845';ctx.fillText('D E T A I L I N G   S T U D I O',512,180);const logo=new T.CanvasTexture(cv);mesh(new T.PlaneGeometry(7,1.75),new T.MeshBasicMaterial({map:logo}),0,3.8,-7.85);for(let x=-5;x<=5;x+=10){box(2.6,1.1,.75,black,x,.55,-6.8);for(let i=0;i<4;i++)box(2.4,.025,.03,silver,x,.25+i*.22,-6.4)}
const car=new T.Group();scene.add(car);rounded(1.96,.52,4.65,.12,paint,0,.67,0,car);rounded(1.88,.23,1.4,.09,paint,0,.98,1.45,car);rounded(1.84,.22,1.05,.08,paint,0,.98,-1.7,car);const cabin=new T.Shape();cabin.moveTo(-1.25,0);cabin.lineTo(-.65,.56);cabin.quadraticCurveTo(0,.65,.65,.55);cabin.lineTo(1.25,0);cabin.closePath();const cg=new T.ExtrudeGeometry(cabin,{depth:1.55,bevelEnabled:false});cg.rotateY(Math.PI/2);cg.translate(-.775,0,0);mesh(cg,glass,0,1.02,0,car);rounded(1.54,.075,1.35,.025,paint,0,1.59,0,car);for(const x of [-1,1]){box(.07,.17,2.1,black,x,.45,0,car);box(.23,.12,.3,paint,x*1.05,1.16,.65,car);for(const z of [-1.43,1.43]){const wheel=mesh(new T.CylinderGeometry(.43,.43,.29,32),black,x,.45,z,car);wheel.rotation.z=Math.PI/2;const rim=mesh(new T.CylinderGeometry(.32,.32,.31,24),silver,x,.45,z,car);rim.rotation.z=Math.PI/2;for(let i=0;i<5;i++){const a=i*Math.PI*2/5;const spoke=box(.035,.065,.54,black,x*1.16,.45,z,car);spoke.rotation.x=a}mesh(new T.CylinderGeometry(.095,.095,.33,16),black,x,.45,z,car).rotation.z=Math.PI/2}const lamp=box(.48,.13,.09,white,x*.65,.94,2.31,car);lamp.rotation.y=x*.15;for(const off of [-.17,.17]){const l=mesh(new T.CylinderGeometry(.13,.13,.06,24),red,x*.65+off,.91,-2.34,car);l.rotation.x=Math.PI/2}box(.12,.28,.13,paint,x*.7,1.18,-1.95,car)}box(1.65,.1,.32,paint,0,1.36,-1.96,car);box(1.25,.27,.06,black,0,.67,2.37,car);box(1.75,.09,.18,black,0,.4,2.38,car);box(1.7,.13,.15,black,0,.43,-2.34,car);box(.38,.11,.03,silver,0,.76,-2.36,car);
const areas=[{name:'Headlights',p:[.7,1.02,2.4],cam:[2,1.7,4.3],desc:'Headlight restoration: remove oxidation, restore clarity and improve the appearance of cloudy lenses.'},{name:'Paintwork',p:[0,1.12,1.35],cam:[3.2,2.5,3],desc:'Paint decontamination and machine polishing to improve gloss and reduce light swirl marks. Ask about availability.'},{name:'Wheels',p:[1.2,.5,1.43],cam:[3.5,1.1,2.2],desc:'Alloy cleaning, brake dust removal, tyre cleaning and dressing.'},{name:'Interior',p:[.8,1.35,0],cam:[3.3,2.1,.2],desc:'Seats, carpets, dashboard, interior plastics and glass. Interior camera is an exterior preview in this prototype.'},{name:'Exterior',p:[-1.05,.85,-.5],cam:[-4,2.2,-3.2],desc:'Pre-wash, contact wash, exterior detailing and drying.'}];const markers=[];const ray=new T.Raycaster();const mouse=new T.Vector2();let flight=null;function fly(pos,target){flight={start:performance.now(),from:camera.position.clone(),at:controls.target.clone(),to:new T.Vector3(...pos),look:new T.Vector3(...target)};controls.enabled=false}function choose(i){const a=areas[i];document.querySelector('#title').textContent=a.name;document.querySelector('#description').textContent=a.desc;document.querySelectorAll('#choices button').forEach((b,j)=>b.classList.toggle('active',i===j));fly(a.cam,a.p)}areas.forEach((a,i)=>{const m=mesh(new T.SphereGeometry(.09,16,12),red,...a.p);m.userData.index=i;markers.push(m);const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>choose(i);document.querySelector('#choices').append(b)});let down;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(markers)[0];if(hit)choose(hit.object.userData.index)});document.querySelector('#reset').onclick=()=>{fly([7,4,8],[0,.8,0]);document.querySelector('#title').textContent='Explore the garage';document.querySelector('#description').textContent='Choose a detailing area to move closer and discover the process.';document.querySelectorAll('#choices button').forEach(b=>b.classList.remove('active'))};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{if(flight){let t=Math.min(1,(performance.now()-flight.start)/1200);let e=t*t*(3-2*t);camera.position.lerpVectors(flight.from,flight.to,e);controls.target.lerpVectors(flight.at,flight.look,e);camera.lookAt(controls.target);if(t===1){flight=null;controls.enabled=true}}else controls.update();markers.forEach((m,i)=>m.scale.setScalar(1+.18*Math.sin(performance.now()/300+i)));renderer.render(scene,camera)});
}catch(e){const d=document.createElement('div');d.id='error';d.textContent='The 3D garage could not start on this device. '+e.message;document.body.append(d)}
