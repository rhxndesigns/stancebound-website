<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>STANCEBOUND | Ultra 3D Garage</title><style>*{box-sizing:border-box}body{margin:0;background:#09090c;color:#eee;font:15px system-ui,sans-serif;overflow:hidden}canvas{display:block;touch-action:none}header{position:absolute;z-index:2;top:0;left:0;right:0;padding:20px;display:flex;justify-content:space-between;align-items:center;background:linear-gradient(#09090cdd,transparent);pointer-events:none}header a{pointer-events:auto;color:white;text-decoration:none;font-size:12px}b{letter-spacing:.18em}b span{color:#ff3046}#panel{position:absolute;bottom:20px;left:20px;right:20px;max-width:430px;background:#101015e8;border:1px solid #ffffff25;border-radius:18px;padding:18px;backdrop-filter:blur(15px)}h1{font-size:24px;margin:5px 0}p{color:#b9b9c4;line-height:1.5;margin:8px 0}small{color:#ff5365;letter-spacing:.15em}button,a.cta{background:#24242c;color:white;border:1px solid #ffffff20;border-radius:9px;padding:10px 12px;cursor:pointer;font:inherit;text-decoration:none}button.active,a.cta{background:#bd1530;border-color:#ff465d}#choices{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}#hint{position:absolute;top:72px;left:20px;color:#bbb;font-size:12px;pointer-events:none}#error{position:absolute;inset:25% 10% auto;z-index:5;background:#202026;padding:20px;border-radius:12px} @media(max-width:600px){#panel{bottom:10px;left:10px;right:10px;padding:10px} #panel p:last-child{display:none}#panel p{font-size:12px;margin:5px 0}#choices{margin:6px 0}h1{font-size:19px}button{font-size:12px;padding:8px}header{padding:14px}}#panel{z-index:4;left:50%;right:auto;bottom:max(12px,env(safe-area-inset-bottom));transform:translateX(-50%);width:max-content;max-width:calc(100% - 20px);padding:5px;border-radius:14px;background:#101015c9;display:flex;flex-direction:column-reverse;gap:5px}#toolbar{display:flex;gap:5px;align-items:center;white-space:nowrap}#toolbar button,#toolbar a{font-size:12px;padding:8px 11px;line-height:18px}#details{width:min(340px,calc(100vw - 32px));padding:8px}#details[hidden]{display:none}.detailhead{display:flex;align-items:center;justify-content:space-between;gap:8px}.detailhead h1{font-size:17px}.detailhead button{padding:3px 10px;font-size:20px}#panel #description{display:block;font-size:12px;margin:4px 0}#choices{margin:6px 0 0}#choices button{font-size:12px;padding:7px 9px}#creditDialog{background:#17171e;color:#eee;border:1px solid #444;border-radius:14px;max-width:85vw;padding:18px}#creditDialog::backdrop{background:#0009}#creditDialog h2{font-size:18px}#creditDialog p{font-size:12px!important}#hint{font-size:10px;top:55px;left:12px}header{padding:12px}header b{font-size:12px}</style><script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"}}</script></head><body><header><b>STANCE<span>BOUND</span> / GARAGE</b><a href="/">← Main website</a></header><div id="hint">Drag to orbit · Pinch or scroll to zoom · Tap a red marker</div><div id="panel"><div id="toolbar"><button id="toggle" aria-expanded="false">☰ Explore</button><button id="reset">↻ Reset</button><a class="cta" href="/">Book</a><button id="credits" aria-label="Model credits">ⓘ</button></div><div id="details" hidden><div class="detailhead"><h1 id="title">Explore the garage</h1><button id="closeDetails" aria-label="Close menu">×</button></div><p id="description">Choose a detailing area.</p><div id="choices"></div></div></div><dialog id="creditDialog"><h2>Model credits</h2><p style="font-size:10px;margin:8px 0 0">Model: <a style="color:#aaa" href="https://sketchfab.com/3d-models/nissan-gtr-r35-51c912a8310c4e00a82ad7673d84228a">Nissan GTR R35 by Ciasny</a> · <a style="color:#aaa" href="https://creativecommons.org/licenses/by/4.0/">CC BY 4.0</a> · Recoloured, resized textures and upgraded materials.</p><button id="closeCredits">Close</button></dialog><script>const details=document.getElementById('details'),toggle=document.getElementById('toggle');function showDetails(open){details.hidden=!open;toggle.setAttribute('aria-expanded',String(open));toggle.textContent=open?'× Explore':'☰ Explore'}toggle.onclick=()=>showDetails(details.hidden);document.getElementById('closeDetails').onclick=()=>showDetails(false);document.getElementById('credits').onclick=()=>document.getElementById('creditDialog').showModal();document.getElementById('closeCredits').onclick=()=>document.getElementById('creditDialog').close();</script><script type="module">
import * as T from 'three';import {Reflector} from 'three/addons/objects/Reflector.js';import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
try{const scene=new T.Scene();scene.background=new T.Color(0x101015);scene.fog=new T.Fog(0x101015,15,35);const camera=new T.PerspectiveCamera(58,innerWidth/innerHeight,.1,70);camera.fov=innerWidth<innerHeight?70:58;camera.updateProjectionMatrix();const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.88;document.body.prepend(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.minDistance=2.6;controls.maxDistance=10.8;controls.enablePan=false;controls.minPolarAngle=1.05;controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,1.15,0);camera.position.set(7.5,3.8,7.5);controls.update();
const mat=(c,m=0,r=.6)=>new T.MeshStandardMaterial({color:c,metalness:m,roughness:r});const paint=mat(0x24252c,.8,.24),black=mat(0x09090b,.1,.8),glass=mat(0x182b39,.65,.13),silver=mat(0x777985,.8,.25),wall=mat(0x19191e),red=new T.MeshBasicMaterial({color:0xff1838}),white=new T.MeshBasicMaterial({color:0xf0f5ff});function mesh(g,m,x,y,z,parent=scene){const o=new T.Mesh(g,m);o.position.set(x,y,z);o.castShadow=true;o.receiveShadow=true;parent.add(o);return o}function box(w,h,d,m,x,y,z,p=scene){return mesh(new T.BoxGeometry(w,h,d),m,x,y,z,p)}function rounded(w,h,d,r,m,x,y,z,p=scene){const sh=new T.Shape();const a=w/2,b=h/2;sh.moveTo(-a+r,-b);sh.lineTo(a-r,-b);sh.quadraticCurveTo(a,-b,a,-b+r);sh.lineTo(a,b-r);sh.quadraticCurveTo(a,b,a-r,b);sh.lineTo(-a+r,b);sh.quadraticCurveTo(-a,b,-a,b-r);sh.lineTo(-a,-b+r);sh.quadraticCurveTo(-a,-b,-a+r,-b);const g=new T.ExtrudeGeometry(sh,{depth:d-2*r,bevelEnabled:true,bevelThickness:r,bevelSize:r*.45,bevelSegments:3,steps:1});g.translate(0,0,-(d-2*r)/2);return mesh(g,m,x,y,z,p)}
const loader=new GLTFLoader();const pmrem=new T.PMREMGenerator(renderer);const room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.04).texture;room.dispose();
const mirror=new Reflector(new T.PlaneGeometry(17.5,17.5),{textureWidth:1024,textureHeight:1024,color:0x777777,clipBias:.003});mirror.rotation.x=-Math.PI/2;mirror.position.y=.025;mirror.material.transparent=true;mirror.material.depthWrite=false;mirror.material.fragmentShader=mirror.material.fragmentShader.replace('vec4( blendOverlay( base.rgb, color ), 1.0 )','vec4( blendOverlay( base.rgb, color ), 0.48 )');mirror.renderOrder=1;scene.add(mirror);
scene.add(new T.HemisphereLight(0xe8efff,0x191018,.32));for(const x of [-4,4])for(const z of [-4,4]){const l=new T.PointLight(0xf0f4ff,38,15);l.position.set(x,4.9,z);scene.add(l);}for(const x of [-7,7]){const l=new T.PointLight(0xff1735,65,12);l.position.set(x,1.5,0);scene.add(l);}const key=new T.DirectionalLight(0xffffff,.85);key.position.set(3,5,3);key.castShadow=true;key.shadow.mapSize.set(2048,2048);Object.assign(key.shadow.camera,{left:-7,right:7,top:7,bottom:-7,near:.1,far:20});key.shadow.bias=-.0003;scene.add(key);
const garageStatus=document.createElement('div');garageStatus.style.cssText='position:absolute;top:100px;right:15px;background:#15151d;padding:10px;z-index:3';garageStatus.textContent='Loading studio…';document.body.append(garageStatus);loader.load('./stancebound_garage_hd.glb',g=>{g.scene.traverse(o=>{if(o.isMesh){o.receiveShadow=true;o.castShadow=false; if(o.material){o.material.envMapIntensity=.55;}}});scene.add(g.scene);mirror.visible=false;const old=scene.environment;scene.environment=pmrem.fromScene(scene,.07,.1,40).texture;old.dispose();mirror.visible=true;pmrem.dispose();garageStatus.remove();},undefined,e=>{garageStatus.textContent='Garage model missing or failed to load';console.error(e)});
const car=new T.Group();scene.add(car);const status=document.createElement('div');status.style.cssText='position:absolute;top:100px;left:20px;background:#15151de8;padding:12px;border-radius:8px;z-index:3';status.textContent='Loading GT-R…';document.body.append(status);new GLTFLoader().load('./gtr_ultra.glb',g=>{const model=g.scene;model.rotation.y=Math.PI/2;car.add(model);car.updateMatrixWorld(true);const bounds=new T.Box3().setFromObject(model);const size=bounds.getSize(new T.Vector3());const scale=4.65/size.z;model.scale.setScalar(scale);model.updateMatrixWorld(true);bounds.setFromObject(model);const center=bounds.getCenter(new T.Vector3());model.position.set(-center.x,-bounds.min.y,-center.z);model.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;for(const m of Array.isArray(o.material)?o.material:[o.material]){m.envMapIntensity=1.35;}}});status.remove();},e=>{if(e.total)status.textContent='Loading GT-R… '+Math.round(e.loaded/e.total*100)+'%';},e=>{status.textContent='Car failed to load. Check gtr_ultra.glb is in the garage folder.';console.error(e);});
const areas=[{name:'Headlights',p:[.7,1.02,2.4],cam:[2,1.7,4.3],desc:'Headlight restoration: remove oxidation, restore clarity and improve the appearance of cloudy lenses.'},{name:'Paintwork',p:[0,1.12,1.35],cam:[3.2,2.5,3],desc:'Paint decontamination and machine polishing to improve gloss and reduce light swirl marks. Ask about availability.'},{name:'Wheels',p:[1.2,.5,1.43],cam:[3.5,1.1,2.2],desc:'Alloy cleaning, brake dust removal, tyre cleaning and dressing.'},{name:'Interior',p:[.8,1.35,0],cam:[3.3,2.1,.2],desc:'Seats, carpets, dashboard, interior plastics and glass. Interior camera is an exterior preview.'},{name:'Exterior',p:[-1.05,.85,-.5],cam:[-4,2.2,-3.2],desc:'Pre-wash, contact wash, exterior detailing and drying.'}];const markers=[];const ray=new T.Raycaster();const mouse=new T.Vector2();let flight=null;function fly(pos,target){flight={start:performance.now(),from:camera.position.clone(),at:controls.target.clone(),to:new T.Vector3(...pos),look:new T.Vector3(...target)};controls.enabled=false}function choose(i){showDetails(true);const a=areas[i];document.querySelector('#title').textContent=a.name;document.querySelector('#description').textContent=a.desc;document.querySelectorAll('#choices button').forEach((b,j)=>b.classList.toggle('active',i===j));fly(a.cam,a.p)}areas.forEach((a,i)=>{const m=mesh(new T.SphereGeometry(.09,16,12),red,...a.p);m.userData.index=i;markers.push(m);const b=document.createElement('button');b.textContent=a.name;b.onclick=()=>choose(i);document.querySelector('#choices').append(b)});let down;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>8)return;mouse.set(e.clientX/innerWidth*2-1,1-e.clientY/innerHeight*2);ray.setFromCamera(mouse,camera);const hit=ray.intersectObjects(markers)[0];if(hit)choose(hit.object.userData.index)});document.querySelector('#reset').onclick=()=>{showDetails(false);fly([7.5,3.8,7.5],[0,1.15,0]);document.querySelector('#title').textContent='Explore the garage';document.querySelector('#description').textContent='Choose a detailing area to move closer and discover the process.';document.querySelectorAll('#choices button').forEach(b=>b.classList.remove('active'))};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.fov=innerWidth<innerHeight?70:58;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{if(flight){let t=Math.min(1,(performance.now()-flight.start)/1200);let e=t*t*(3-2*t);camera.position.lerpVectors(flight.from,flight.to,e);controls.target.lerpVectors(flight.at,flight.look,e);camera.lookAt(controls.target);if(t===1){flight=null;controls.enabled=true}}else controls.update();camera.position.x=T.MathUtils.clamp(camera.position.x,-8.1,8.1);camera.position.z=T.MathUtils.clamp(camera.position.z,-8.1,8.1);camera.position.y=T.MathUtils.clamp(camera.position.y,.45,4.8);camera.lookAt(controls.target);markers.forEach((m,i)=>m.scale.setScalar(1+.18*Math.sin(performance.now()/300+i)));renderer.render(scene,camera)});
}catch(e){const d=document.createElement('div');d.id='error';d.textContent='The 3D garage could not start on this device. '+e.message;document.body.append(d)}
